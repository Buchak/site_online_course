{% extends 'main/base.html' %}

{% block title %}
	{{ lesson.title }}
{% endblock %}

{% block body %}
    <h1>{{ lesson.title }}</h1>
	<div>
    <h3>Content</h3>
    <p>{{ lesson.content }}</p>
    </div>
    
    <div>
    <h3>Video</h3>
        <a href="#">Video</a>
    </div>

    <br>
    <div>
        <a href="{% url 'main:update_lesson' course_slug=lesson.course.slug lesson_slug=lesson.slug %}">Update Lesson</a>
    </div>

    <br>
    <div>
        <a href="{% url 'main:delete_lesson' course_slug=lesson.course.slug lesson_slug=lesson.slug %}">Delete Lesson</a>
    </div>
{% endblock %}
