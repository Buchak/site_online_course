<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>
        {% block title %}
        	Base Title
        {% endblock %}
    </title>
</head>
<body>

<div>
    {% if user.is_authenticated %}
        <form method="POST" action="{% url 'myauth:logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'myauth:login' %}">Login</a>
        <br>
        <a href="{% url 'myauth:register' %}">Register</a>
        <br>
        <a href="{% url 'myauth:profile' %}">Profile</a>
    {% endif %}
</div>

<div>
    <a href="{% url 'main:courses_list' %}">Courses List</a>
</div>
<div>
    <a href="{% url 'main:category_list' %}">Category List</a>
</div>

{% block body %}
	Base Body
{% endblock %}
</body>
</html>
