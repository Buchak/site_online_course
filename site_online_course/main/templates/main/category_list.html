{% extends 'main/base.html' %}

{% block title %}
	Categories
{% endblock %}

{% block body %}
	<h1>Categories</h1>

    <div>
        <a href="{% url 'main:create_category' %}">Create Category</a>
    </div>
    <br>

    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'main:category_detail' category.slug %}">{{ category.name }}</a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
